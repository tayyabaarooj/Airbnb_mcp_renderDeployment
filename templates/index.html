<!DOCTYPE html>
<html>
<head>
    <title>Airbnb Search Assistant</title>
</head>
<body>
    <h1>Airbnb Search Assistant</h1>
    <form id="searchForm">
        <label for="query">Enter your booking requirements:</label><br>
        <input type="text" id="query" name="query" placeholder="e.g., 2-bedroom in Toronto next weekend" required><br><br>
        <button type="submit">Search</button>
    </form>

    <h2>Results:</h2>
    <pre id="result"></pre>

    <script>
        const form = document.getElementById("searchForm");
        const resultBox = document.getElementById("result");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            resultBox.textContent = "Searching...";

            const query = document.getElementById("query").value;

            const response = await fetch("/search", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ query })
            });

            const data = await response.json();
            if (data.result) {
                resultBox.textContent = data.result;
            } else {
                resultBox.textContent = "Error: " + (data.error || "Unknown error");
            }
        });
    </script>
</body>
</html>
